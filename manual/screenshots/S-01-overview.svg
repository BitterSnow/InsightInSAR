<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf7fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5fbf"/>
      <stop offset="1" stop-color="#00a6b6"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7ff"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0fbfb"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1fbf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17345c" flood-opacity="0.15"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 50px; font-weight: 800; fill: #17223a; }
      .subtitle { font-size: 22px; fill: #5b6477; }
      .card-title { font-size: 30px; font-weight: 800; fill: #17223a; }
      .card-subtitle { font-size: 17px; fill: #5b6477; }
      .label { font-size: 21px; font-weight: 700; fill: #24304a; }
      .small { font-size: 17px; fill: #5b6477; }
      .tiny { font-size: 15px; fill: #6c7485; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="100" r="170" fill="#dff5f8" opacity="0.7"/>
  <circle cx="60" cy="830" r="220" fill="#e8f0ff" opacity="0.8"/>

  <g class="font">
    <text x="800" y="86" class="title" text-anchor="middle">Insight InSAR 运行架构</text>
    <text x="800" y="124" class="subtitle" text-anchor="middle">Windows 负责操作与管理，WSL 负责 Linux 科学计算，ISCE2 / MintPy 执行核心处理</text>

    <g filter="url(#shadow)">
      <rect x="96" y="185" width="400" height="470" rx="28" fill="url(#card1)" stroke="#d6e2f0" stroke-width="2"/>
      <rect x="600" y="185" width="400" height="470" rx="28" fill="url(#card2)" stroke="#d6e2f0" stroke-width="2"/>
      <rect x="1104" y="185" width="400" height="470" rx="28" fill="url(#card3)" stroke="#d6e2f0" stroke-width="2"/>
    </g>

    <g>
      <circle cx="296" cy="255" r="44" fill="#1f5fbf"/>
      <rect x="273" y="236" width="46" height="34" rx="5" fill="#ffffff"/>
      <rect x="282" y="271" width="28" height="7" rx="3" fill="#ffffff"/>
      <rect x="267" y="281" width="58" height="6" rx="3" fill="#ffffff"/>
      <text x="296" y="335" class="card-title" text-anchor="middle">Windows Desktop</text>
      <text x="296" y="365" class="card-subtitle" text-anchor="middle">PySide6 本地桌面端</text>

      <rect x="150" y="408" width="292" height="46" rx="12" fill="#eaf2ff"/>
      <text x="296" y="438" class="label" text-anchor="middle">工程管理与项目路径</text>
      <rect x="150" y="472" width="292" height="46" rx="12" fill="#eaf2ff"/>
      <text x="296" y="502" class="label" text-anchor="middle">ROI / KML / 参数配置</text>
      <rect x="150" y="536" width="292" height="46" rx="12" fill="#eaf2ff"/>
      <text x="296" y="566" class="label" text-anchor="middle">流程按钮、状态与日志</text>
      <text x="296" y="616" class="small" text-anchor="middle">用户在 Windows 侧完成所有操作</text>
    </g>

    <g>
      <circle cx="800" cy="255" r="44" fill="#00a6b6"/>
      <path d="M780 260 C780 241 791 230 808 230 C825 230 838 244 838 260 C838 276 825 289 808 289 C790 289 780 279 780 260 Z" fill="#ffffff"/>
      <path d="M758 260 C758 241 769 230 786 230 C803 230 816 244 816 260 C816 276 803 289 786 289 C768 289 758 279 758 260 Z" fill="#ffffff" opacity="0.72"/>
      <text x="800" y="335" class="card-title" text-anchor="middle">WSL Bridge</text>
      <text x="800" y="365" class="card-subtitle" text-anchor="middle">Windows 与 Ubuntu 的桥接层</text>

      <rect x="654" y="408" width="292" height="46" rx="12" fill="#e8fbfb"/>
      <text x="800" y="438" class="label" text-anchor="middle">Windows 路径转 /mnt 路径</text>
      <rect x="654" y="472" width="292" height="46" rx="12" fill="#e8fbfb"/>
      <text x="800" y="502" class="label" text-anchor="middle">加载 wsl_config.env</text>
      <rect x="654" y="536" width="292" height="46" rx="12" fill="#e8fbfb"/>
      <text x="800" y="566" class="label" text-anchor="middle">source 环境脚本并执行任务</text>
      <text x="800" y="616" class="small" text-anchor="middle">负责路径、环境变量和日志回传</text>
    </g>

    <g>
      <circle cx="1304" cy="255" r="44" fill="#1f8a5b"/>
      <path d="M1278 269 L1294 244 L1310 269 Z" fill="#ffffff"/>
      <path d="M1301 269 L1317 244 L1333 269 Z" fill="#ffffff" opacity="0.78"/>
      <rect x="1275" y="273" width="62" height="8" rx="4" fill="#ffffff"/>
      <text x="1304" y="335" class="card-title" text-anchor="middle">ISCE2 + MintPy</text>
      <text x="1304" y="365" class="card-subtitle" text-anchor="middle">Ubuntu / Conda 计算环境</text>

      <rect x="1158" y="408" width="292" height="46" rx="12" fill="#eaf8f1"/>
      <text x="1304" y="438" class="label" text-anchor="middle">DEM / S1 导入</text>
      <rect x="1158" y="472" width="292" height="46" rx="12" fill="#eaf8f1"/>
      <text x="1304" y="502" class="label" text-anchor="middle">topsStack 干涉处理</text>
      <rect x="1158" y="536" width="292" height="46" rx="12" fill="#eaf8f1"/>
      <text x="1304" y="566" class="label" text-anchor="middle">MintPy 时间序列分析</text>
      <text x="1304" y="616" class="small" text-anchor="middle">核心 InSAR 计算只在 WSL 内运行</text>
    </g>

    <line x1="516" y1="420" x2="570" y2="420" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/>
    <path d="M570 420 L558 412 L558 428 Z" fill="#1f5fbf"/>
    <line x1="1020" y1="420" x2="1074" y2="420" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round"/>
    <path d="M1074 420 L1062 412 L1062 428 Z" fill="#1f5fbf"/>
    <line x1="1086" y1="555" x2="1032" y2="555" stroke="#00a6b6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M1032 555 L1044 547 L1044 563 Z" fill="#00a6b6" opacity="0.85"/>
    <line x1="582" y1="555" x2="528" y2="555" stroke="#00a6b6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M528 555 L540 547 L540 563 Z" fill="#00a6b6" opacity="0.85"/>
    <text x="548" y="399" class="tiny" text-anchor="middle">提交任务</text>
    <text x="1052" y="399" class="tiny" text-anchor="middle">调用计算</text>
    <text x="1052" y="592" class="tiny" text-anchor="middle">日志 / 结果</text>
    <text x="548" y="592" class="tiny" text-anchor="middle">状态回传</text>

    <rect x="132" y="704" width="1336" height="92" rx="24" fill="#ffffff" stroke="#d6e2f0" stroke-width="2" filter="url(#shadow)"/>
    <text x="170" y="747" class="label">典型处理链路</text>
    <g class="small">
      <text x="360" y="747" text-anchor="middle">新建工程</text>
      <text x="530" y="747" text-anchor="middle">定义工作区</text>
      <text x="700" y="747" text-anchor="middle">DEM 制作</text>
      <text x="870" y="747" text-anchor="middle">S1 导入</text>
      <text x="1040" y="747" text-anchor="middle">Stack</text>
      <text x="1210" y="747" text-anchor="middle">MintPy</text>
      <text x="1380" y="747" text-anchor="middle">结果导出</text>
    </g>
    <g stroke="#c7d4e4" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M421 742 L460 742"/>
      <path d="M591 742 L630 742"/>
      <path d="M761 742 L800 742"/>
      <path d="M931 742 L970 742"/>
      <path d="M1101 742 L1140 742"/>
      <path d="M1271 742 L1310 742"/>
    </g>
    <g fill="#4f7ed0" opacity="0.8">
      <path d="M460 742 L451 736 L451 748 Z"/>
      <path d="M630 742 L621 736 L621 748 Z"/>
      <path d="M800 742 L791 736 L791 748 Z"/>
      <path d="M970 742 L961 736 L961 748 Z"/>
      <path d="M1140 742 L1131 736 L1131 748 Z"/>
      <path d="M1310 742 L1301 736 L1301 748 Z"/>
    </g>

    <text x="800" y="842" class="subtitle" text-anchor="middle">关键原则：界面可用不等于计算可用，计算链路必须同时满足 WSL、环境脚本、项目路径和数据路径可访问。</text>
  </g>
</svg>
